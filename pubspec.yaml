name: cad_view
description: "Offline, open-source multi-format CAD viewer for Android and iOS."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+3

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  file_picker: ^12.1.0
  pdfium_flutter: ^0.2.3
  pdfrx_engine: ^0.4.6
  cad_native:
    path: rust_builder
  flutter_rust_bridge: 2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Cargokit currently builds the Rust static library through CocoaPods.
  # Keep this project-local so other Flutter projects may still use SwiftPM.
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - third_party_licenses/NotoSansCJK-OFL-1.1.txt
    - third_party_licenses/NotoFonts-OFL-1.1.txt

  # Deterministic offline fallback for DWG/DXF SHX styles. Noto Sans CJK is
  # redistributed unmodified under SIL OFL 1.1; see third_party_licenses/.
  fonts:
    - family: CADView Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
    - family: CADView Noto CJK
      fonts:
        - asset: assets/fonts/NotoSansCJKsc-Regular.otf
    - family: CADView Noto Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
    - family: CADView Noto Hebrew
      fonts:
        - asset: assets/fonts/NotoSansHebrew-Regular.ttf
    - family: CADView Noto Thai
      fonts:
        - asset: assets/fonts/NotoSansThai-Regular.ttf
    - family: CADView Noto Devanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
    - family: CADView Noto Bengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
    - family: CADView Noto Gujarati
      fonts:
        - asset: assets/fonts/NotoSansGujarati-Regular.ttf
    - family: CADView Noto Gurmukhi
      fonts:
        - asset: assets/fonts/NotoSansGurmukhi-Regular.ttf
    - family: CADView Noto Tamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
    - family: CADView Noto Telugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu-Regular.ttf
    - family: CADView Noto Kannada
      fonts:
        - asset: assets/fonts/NotoSansKannada-Regular.ttf
    - family: CADView Noto Malayalam
      fonts:
        - asset: assets/fonts/NotoSansMalayalam-Regular.ttf
    - family: CADView Noto Sinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala-Regular.ttf
    - family: CADView Noto Lao
      fonts:
        - asset: assets/fonts/NotoSansLao-Regular.ttf
    - family: CADView Noto Khmer
      fonts:
        - asset: assets/fonts/NotoSansKhmer-Regular.ttf
    - family: CADView Noto Myanmar
      fonts:
        - asset: assets/fonts/NotoSansMyanmar-Regular.ttf
    - family: CADView Noto Armenian
      fonts:
        - asset: assets/fonts/NotoSansArmenian-Regular.ttf
    - family: CADView Noto Georgian
      fonts:
        - asset: assets/fonts/NotoSansGeorgian-Regular.ttf
    - family: CADView Noto Ethiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
    - family: CADView Noto Tibetan
      fonts:
        - asset: assets/fonts/NotoSerifTibetan-Regular.ttf
    - family: CADView Noto Symbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols-Regular.ttf
    - family: CADView Noto Symbols 2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf
    - family: CADView Noto Sans Narrow
      fonts:
        - asset: assets/fonts/CADViewNotoSansNarrow-Regular.ttf
    - family: CADView CAD Symbols
      fonts:
        - asset: assets/fonts/CADViewCadSymbols-Regular.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add more custom fonts to your application, extend the fonts section,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
