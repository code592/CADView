[package]
name = "cad_native"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace]
members = ["crates/cad-core", "crates/cad-formats", "crates/cad-storage"]
exclude = ["fuzz"]
resolver = "2"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
cad-core = { path = "crates/cad-core", version = "0.1.0" }
cad-formats = { path = "crates/cad-formats", version = "0.1.0" }
cad-storage = { path = "crates/cad-storage", version = "0.1.0" }
blake3 = "1.8"
ciborium = "0.2"
flutter_rust_bridge = "=2.13.0"
once_cell = "1.21"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.22"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
